name: aivlm_ic

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.12.1

  cloud_firestore: ^6.7.1

  provider: ^6.1.5+1

  image_picker: ^1.2.3

  firebase_storage: ^13.4.5

  js: ^0.6.7

  url_launcher: ^6.3.1

  flutter_local_notifications: ^19.4.0

  intl: ^0.20.3

  firebase_auth: ^6.6.0

  flutter_image_compress: ^2.5.1

  file_picker: ^11.0.2

  firebase_crashlytics: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_native_splash: ^2.4.8

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

flutter_native_splash:
  color: "#FFFFFF"

  image: assets/images/logo.png

  android: true

  ios: true

  web: false

  android_12:
    color: "#FFFFFF"
    image: assets/images/logo.png

  fullscreen: true

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"